# Project name: fixes the container and volume names (groove-db-1, groove_dbdata, ...).
name: groove

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-groove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-groove}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groove}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    # CI publishes ready images (API_IMAGE=ghcr.io/<owner>/groove-api); locally they are built.
    image: ${API_IMAGE:-groove-api}:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-groove}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-groove}
      FERNET_KEY: ${FERNET_KEY:-}
      DISCOGS_CONSUMER_KEY: ${DISCOGS_CONSUMER_KEY:-}
      DISCOGS_CONSUMER_SECRET: ${DISCOGS_CONSUMER_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    volumes:
      - covers:/srv/api/covers
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    image: ${WEB_IMAGE:-groove-web}:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      # With a domain in SITE_ADDRESS, Caddy also needs 443 (set HTTPS_PORT=443 and HTTP_PORT=80).
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  dbdata:
  covers:
  caddy_data:
