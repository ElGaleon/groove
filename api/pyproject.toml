[project]
name = "groove-api"
version = "0.1.0"
description = "API for Groove, the family vinyl collection"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "cryptography>=50.0.2",
    "oauthlib>=4.0.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]  # generated migrations
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]
